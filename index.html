<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>masarabi のアプリ</title>
<style>
  :root {
    --paper: #FFFCF6;
    --card: #FFFFFF;
    --ink: #3A2E26;
    --ink-soft: #7A6A5E;
    --line: #EFE4D8;
    --accent: #E85F41;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #1C1815;
      --card: #262120;
      --ink: #F2E9E1;
      --ink-soft: #A5948A;
      --line: #3A322C;
      --accent: #FF9C82;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic",
                 system-ui, -apple-system, sans-serif;
    line-height: 1.9;
    font-size: 16px;
  }
  main { max-width: 36rem; margin: 0 auto; padding: 3rem 1.5rem 6rem; }
  h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
  .sub {
    font-size: 0.9rem;
    color: var(--ink-soft);
    margin: 0 0 2.5rem;
    padding-bottom: 1.5rem;
    border-bottom: 2px dotted var(--line);
  }
  ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 0.75rem; }
  li a {
    display: block;
    background: var(--card);
    border-radius: 16px;
    padding: 1.1rem 1.4rem;
    text-decoration: none;
    color: var(--ink);
    font-weight: 700;
  }
  li a span {
    display: block;
    font-size: 0.8rem;
    font-weight: 400;
    color: var(--ink-soft);
    margin-top: 0.15rem;
  }
  li a:hover { outline: 2px solid var(--accent); }
</style>
</head>
<body>
<main>
  <h1>masarabi のアプリ</h1>
  <p class="sub">個人で作っている iPhone アプリです。</p>
  <ul>
    <li>
      <a href="https://apps.apple.com/jp/app/id6810739896">
        スマホ、おやすみ番
        <span>決めた時刻になると、選んだアプリが開けなくなる</span>
      </a>
    </li>
    <li>
      <a href="./app-privacy/">
        プライバシーポリシー・お問い合わせ
        <span>各アプリのプライバシーポリシー</span>
      </a>
    </li>
  </ul>
</main>
</body>
</html>
